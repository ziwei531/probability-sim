<nav class="site-nav" aria-label="Simulators">
	<a class="nav-link active" href="index.html" aria-current="page">Coin Flip</a>
	<a class="nav-link" href="gacha.html">Gacha Simulator</a>
</nav>
<main class="app coin-app">
	<header class="app-header">
		<p class="eyebrow">Probability playground</p>
		<h1>Coin Flip</h1>
		<p class="app-intro">Bias the coin, then watch randomness prove—or betray—your odds.</p>
	</header>
	<div class="scene">
		<button class="coin-mover" id="coin" type="button" aria-label="Flip the coin">
			<span class="coin">
				<span class="coin-face coin-heads" aria-hidden="true">
					<img class="coin-art" src="assets/50sen-heads.png" alt="">
				</span>
				<span class="coin-face coin-tails" aria-hidden="true">
					<img class="coin-art" src="assets/50sen-tails.png" alt="">
				</span>
			</span>
		</button>
		<div class="coin-shadow" aria-hidden="true"></div>
	</div>
	<section class="control-card coin-controls" aria-label="Coin controls">
		<div class="controls">
			<label class="percent-field">
				<span>Heads</span>
				<span class="percent-input-row">
					<input id="heads-input" type="number" min="0" max="100" step="0.01" value="50" inputmode="decimal" aria-describedby="coin-error" required>
					<span class="percent-suffix">%</span>
				</span>
			</label>
			<label class="percent-field">
				<span>Tails</span>
				<span class="percent-input-row">
					<input id="tails-input" type="number" min="0" max="100" step="0.01" value="50" inputmode="decimal" aria-describedby="coin-error" required>
					<span class="percent-suffix">%</span>
				</span>
			</label>
		</div>
		<p class="field-error" id="coin-error" role="alert" hidden>Enter a valid percentage before flipping.</p>
		<button class="primary-button" id="flip-button" type="button">Flip the coin</button>
	</section>
	<section class="result-panel" aria-label="Flip results">
		<p class="result" id="result" aria-live="polite">Ready when you are.</p>
		<p class="stats" id="stats">Heads: 0 · Tails: 0</p>
	</section>
</main>
