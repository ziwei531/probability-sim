	<nav class="site-nav" aria-label="Simulators">
		<a class="nav-link" href="index.html" data-view="views/coin-flip.html" data-script="js/script.js">Coin Flip</a>
		<a class="nav-link active" href="index.html?view=gacha" data-view="views/gacha.html" data-script="js/gacha.js" aria-current="page">Gacha Simulator</a>
	</nav>
	<main class="app gacha-app">
		<header class="app-header">
			<p class="eyebrow">Probability tools</p>
			<h1>Gacha Simulator</h1>
			<p class="app-intro">Set the SSR and UR rates, then run a ten-pull.</p>
		</header>
		<section class="control-card gacha-control-card" aria-label="Gacha controls">
			<div class="gacha-controls">
				<label class="percent-field">
					<span>SSR probability</span>
					<span class="percent-input-row">
						<input id="ssr-input" type="number" min="0" max="100" step="0.1" value="4" inputmode="decimal" aria-describedby="ssr-error expected-ssr-line">
						<span class="percent-suffix">%</span>
					</span>
				</label>
				<label class="percent-field">
					<span>UR (Pilgrim) probability</span>
					<span class="percent-input-row">
						<input id="ur-input" type="number" min="0" max="100" step="0.1" value="0.5" inputmode="decimal" aria-describedby="ssr-error">
						<span class="percent-suffix">%</span>
					</span>
				</label>
				<div class="button-row">
					<button class="primary-button" id="pull-button" type="button">10 Pulls</button>
					<button id="clear-button" type="button">Clear</button>
				</div>
			</div>
			<p class="field-error" id="ssr-error" role="alert" hidden></p>
			<p class="stats expected-line" id="expected-ssr-line" aria-live="polite"></p>
			<div class="odds-breakdown">
				<span class="odds-chip odds-ssr">SSR <strong id="odds-ssr">4%</strong></span>
				<span class="odds-chip odds-ur">UR <strong id="odds-ur">0.5%</strong></span>
				<span class="odds-chip odds-sr">SR <strong id="odds-sr">19.2%</strong></span>
				<span class="odds-chip odds-r">R <strong id="odds-r">76.8%</strong></span>
				<span class="odds-chip odds-ten">At least one SSR in 10 <strong id="ten-pull-chance">33.52%</strong></span>
				<span class="odds-chip odds-ten odds-ur">At least one UR in 10 <strong id="ten-ur-chance">4.89%</strong></span>
			</div>
		</section>
		<p class="status" id="status" aria-live="polite" hidden></p>
		<div class="results-heading">
			<h2>Latest ten-pull</h2>
			<p>Open a card to view its artwork source.</p>
		</div>
		<p class="empty-state" id="results-empty">Your pulls will appear here.</p>
		<ol class="results-grid" id="results" aria-label="Pull results"></ol>
		<section class="summary" id="summary" aria-label="Pull summary" hidden>
			<p class="stats" id="batch-stats"></p>
			<p class="stats" id="session-stats"></p>
		</section>
	</main>
