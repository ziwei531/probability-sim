<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Coin Flip</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app">
		<h1>Coin Flip</h1>
		<div class="scene">
			<div class="coin-shadow" aria-hidden="true"></div>
			<div class="coin-mover" id="coin" role="button" tabindex="0" aria-label="Flip the coin">
				<div class="coin">
					<div class="coin-face coin-heads" aria-hidden="true">H</div>
					<div class="coin-face coin-tails" aria-hidden="true">T</div>
				</div>
			</div>
		</div>
		<div class="controls">
			<label class="percent-field">
				<span>Heads %</span>
				<input id="heads-input" type="number" min="0" max="100" step="0.01" value="50" inputmode="decimal">
			</label>
			<label class="percent-field">
				<span>Tails %</span>
				<input id="tails-input" type="number" min="0" max="100" step="0.01" value="50" inputmode="decimal">
			</label>
		</div>
		<button id="flip-button" type="button">Flip</button>
		<p class="result" id="result" aria-live="polite"></p>
		<p class="stats" id="stats">Heads: 0 · Tails: 0</p>
	</main>
	<script src="script.js"></script>
</body>
</html>
